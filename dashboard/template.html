<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library</title>
<style>
:root{
  --bg:#0b0e14; --panel:#121823; --panel2:#18202d; --line:#243041; --text:#eef1f6; --muted:#9aa4b6; --faint:#6b7486;
  --accent:#9db8ff; --accent2:#5b8cff; --ok:#7ee2a8; --warn:#ffd180; --bad:#ff8a80;
  --movies:#ff7a7a; --tv:#ffb74d; --anime:#ba68c8; --books:#f4b860; --photos:#f48fb1; --other:#90a4ae;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:22px 28px 60px}
header{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:18px}
.brand h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.2px}
.brand .sub{color:var(--muted);font-size:13px}
.search{flex:1;min-width:280px;position:relative}
.search input{width:100%;padding:12px 16px 12px 42px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;outline:none}
.search input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #5b8cff33}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6}
nav.tabs{display:flex;gap:6px;background:var(--panel);padding:5px;border-radius:12px;border:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:8px 16px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.links{display:flex;gap:10px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:16px 18px;cursor:pointer;transition:.15s}
.kpi:hover{border-color:#3a4a63;transform:translateY(-1px)}
.kpi .n{font-size:28px;font-weight:600;letter-spacing:-.5px}
.kpi .l{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
h2{font-size:17px;font-weight:600;margin:26px 0 12px}
.drives{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.drive{padding:18px}
.drive .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drive .name{font-size:17px;font-weight:600}
.drive .meta{color:var(--muted);font-size:12.5px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid}
.pill.on{color:var(--ok);border-color:#7ee2a855;background:#7ee2a814}
.pill.off{color:var(--faint);border-color:#6b748655;background:#6b748614}
.bar{height:10px;border-radius:6px;background:#1f2938;overflow:hidden;display:flex;margin:14px 0 6px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12px;margin-top:8px}
.legend b{color:var(--text);font-weight:500}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.rows{padding:10px 16px}
.row{display:grid;grid-template-columns:120px 1fr 60px;gap:10px;align-items:center;padding:5px 0;cursor:pointer}
.row .t{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{text-align:right;color:var(--faint);font-size:12.5px}
.row .b{height:8px;border-radius:5px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.row:hover .t{color:var(--text)}
.strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
/* watch */
.watch{display:grid;grid-template-columns:270px 1fr;gap:20px}
@media (max-width:900px){.watch{grid-template-columns:1fr}}
.filters{padding:16px;position:sticky;top:12px;align-self:start;max-height:calc(100vh - 30px);overflow:auto}
.filters h4{margin:14px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:600}
.filters h4:first-child{margin-top:0}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:6px 4px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:12.5px}
.seg button.on{background:#2a3547;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);padding:4px 10px;border-radius:999px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.chip.on{border-color:var(--accent2);color:var(--text);background:#5b8cff22}
.chip .c{color:var(--faint);margin-left:4px}
select,.fin{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;outline:none}
label.tog{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;cursor:pointer;margin-top:4px}
.resbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.active{display:flex;gap:6px;flex-wrap:wrap}
.active .chip{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:18px}
.tile{cursor:pointer}
.poster{aspect-ratio:2/3;border-radius:12px;overflow:hidden;position:relative;background:#1a2230;border:1px solid var(--line);transition:.15s}
.tile:hover .poster{transform:translateY(-2px);border-color:#3e4f6b;box-shadow:0 10px 24px #0007}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-weight:600;font-size:15px;line-height:1.2}
.ph small{font-weight:400;color:#ffffffaa;font-size:12px;margin-top:4px}
.badges{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:4px}
.bdg{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:#000a;color:#fff;backdrop-filter:blur(4px)}
.bdg.k4{background:#ffd180;color:#1a1200}
.bdg.off{background:#000c;color:#aab}
.tile .tt{margin-top:8px;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts{color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{display:block;margin:22px auto 0;padding:10px 22px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
/* drawer */
.scrim{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:.25s;overflow:auto;z-index:5}
.drawer.on{transform:none}
.dhead{display:flex;gap:18px;padding:24px 24px 10px}
.dhead .poster{width:130px;flex:none}
.dhead h3{margin:0 0 4px;font-size:22px;line-height:1.2}
.dbody{padding:4px 24px 30px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:14px 0;font-size:13.5px}
.kv dt{color:var(--faint)} .kv dd{margin:0}
.lnk{cursor:pointer;color:var(--accent)} .lnk:hover{text-decoration:underline}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.btn{border:1px solid var(--line);background:var(--panel2);padding:7px 13px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--text)}
.btn:hover{border-color:#3e4f6b}
.btn.pri{background:var(--accent2);border-color:var(--accent2)}
.close{position:absolute;top:14px;right:16px;background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer}
.path{font-family:Consolas,monospace;font-size:12px;color:var(--muted);word-break:break-all;background:#0b0e14;padding:8px 10px;border-radius:8px;border:1px solid var(--line)}
/* files */
.ftools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ftools .fin{width:auto;flex:1;min-width:220px}
.flist{overflow:hidden}
.fr{display:grid;grid-template-columns:34px minmax(0,2.2fr) minmax(0,2fr) 90px 150px;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid #1d2532;font-size:13px}
.fr:last-child{border-bottom:0}
.fr.head{color:var(--faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;background:var(--panel2)}
.fr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .fd{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--faint);cursor:pointer}
.fr .fd:hover{color:var(--accent)}
.fr .sz{text-align:right;color:var(--muted)}
.ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#0b0e14}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:14px}
.crumbs span{cursor:pointer;color:var(--accent)} .crumbs i{color:var(--faint);font-style:normal}
.empty{padding:40px;text-align:center;color:var(--faint)}
.hide{display:none!important}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2a3547;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>Library</h1><div class="sub" id="sub"></div></div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search titles, directors, actors, languages, files…" autocomplete="off">
    </div>
    <nav class="tabs" id="tabs">
      <button data-t="overview" class="on">Overview</button>
      <button data-t="watch">Watch</button>
      <button data-t="files">Files</button>
      <button data-t="folders">Folders</button>
    </nav>
  </header>

  <section id="overview">
    <div class="kpis" id="kpis"></div>
    <h2>Drives</h2>
    <div class="drives" id="drives"></div>
    <h2>Recently added</h2>
    <div class="strip" id="recent"></div>
    <div class="split">
      <div><h2>Languages</h2><div class="card rows" id="langs"></div></div>
      <div><h2>Genres</h2><div class="card rows" id="genres"></div></div>
      <div><h2>Directors</h2><div class="card rows" id="dirs"></div></div>
      <div><h2>Decades</h2><div class="card rows" id="decades"></div></div>
    </div>
  </section>

  <section id="watch" class="hide">
    <div class="watch">
      <aside class="card filters" id="filters">
        <h4>Show</h4>
        <div class="seg" id="kindSeg">
          <button data-k="" class="on">All</button><button data-k="Movie">Movies</button><button data-k="TV">TV</button><button data-k="Anime">Anime</button><button data-k="Animation">Animation</button><button data-k="Home">Home videos</button>
        </div>
        <div id="titleFilters">
        <h4>Language</h4><select id="fLang"></select>
        <h4>Director</h4><select id="fDir"></select>
        <h4>Genre</h4><div class="chips" id="fGen"></div>
        <h4>Decade</h4><div class="chips" id="fDec"></div>
        <h4>Quality</h4><div class="chips" id="fQ"></div>
        </div>
        <div id="homeFilters" class="hide"><h4>People</h4><select id="fPeople"></select><h4>Type</h4><div class="chips" id="fHK"></div></div>
        <h4>Drive</h4><select id="fDrive"></select>
        <label class="tog"><input type="checkbox" id="fOn"> Only drives connected now</label>
        <label class="tog"><input type="checkbox" id="fAdult"> Include NC17 / adult</label>
        <h4>Sort</h4>
        <select id="fSort"><option value="az">Title A–Z</option><option value="new">Recently added</option><option value="year">Newest release</option><option value="old">Oldest release</option><option value="size">Largest</option></select>
        <button class="btn" style="margin-top:14px;width:100%" id="reset">Clear filters</button>
      </aside>
      <div>
        <div class="resbar"><div id="count"></div><div class="active" id="active"></div></div>
        <div class="grid" id="grid"></div>
        <button class="more hide" id="more">Show more</button>
      </div>
    </div>
  </section>

  <section id="files" class="hide">
    <div class="ftools">
      <select id="fType" style="width:auto"></select>
      <select id="fFDrive" style="width:auto"></select>
      <select id="fFSort" style="width:auto"><option value="rel">Best match</option><option value="size">Largest first</option><option value="new">Newest first</option><option value="name">Name A–Z</option></select>
      <span id="fcount" style="color:var(--muted);font-size:13px"></span>
    </div>
    <div class="card flist" id="flist"></div>
  </section>

  <section id="folders" class="hide">
    <div class="crumbs" id="crumbs"></div>
    <div class="card flist" id="ftree"></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtSize = b => b >= 1e12 ? (b/1099511627776).toFixed(2)+" TB" : b >= 1073741824 ? (b/1073741824).toFixed(1)+" GB" : b >= 1048576 ? (b/1048576).toFixed(1)+" MB" : b >= 1024 ? Math.round(b/1024)+" KB" : b+" B";
const num = n => Number(n).toLocaleString("en-IN");
const fileUrl = p => "file:///" + encodeURI(String(p).replace(/\\/g, "/")).replace(/#/g, "%23").replace(/\?/g, "%3F");
const TYPE_COL = {Video:"var(--movies)",Image:"var(--photos)",Audio:"#4fc3f7",eBook:"var(--books)",Comic:"#c792ea",PDF:"#e78fb3",Document:"#aed581",Spreadsheet:"#81c784",Presentation:"#ffab91",Archive:"#b0bec5",Installer:"#90a4ae",Code:"#80cbc4",Subtitle:"#78909c",Shortcut:"#78909c","System/meta":"#546e7a",Other:"#607d8b"};
const KIND_COL = {Movie:"var(--movies)",TV:"var(--tv)",Anime:"var(--anime)"};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1600)}
function copy(t){navigator.clipboard?.writeText(t).then(()=>toast("Path copied"),()=>toast("Couldn't copy"))}

if (!DATA) { document.body.innerHTML = '<div class="empty">No catalogue data yet — Desktop Organizer writes this page after its first drive scan.</div>'; throw 0; }
const drives = DATA.drives, titles = DATA.titles, types = DATA.types;
const files = DATA.files.map(f => ({d:f[0], rel:f[1], size:f[2], type:types[f[3]], q:f[4], age:f[5], name:f[1].slice(f[1].lastIndexOf("\\")+1)}));
files.forEach(f => f.lname = f.name.toLowerCase());
titles.forEach((t,i) => { t.i=i; t.hay = [t.t,t.ot,t.y,t.k,t.q,...t.dir,...t.cast,...t.lang,...t.ctry,...t.gen].join(" ").toLowerCase();
  t.dec = t.y ? Math.floor(t.y/10)*10 : 0; t.qk = /^4K/.test(t.q)?"4K":/^1440p|^1080p/.test(t.q)?"1080p":/^720p/.test(t.q)?"720p":t.q?"SD":"Unknown"; });
const totalFiles = files.length, totalSize = drives.reduce((a,d)=>a+d.size,0);
$("#sub").textContent = `${num(totalFiles)} files · ${fmtSize(totalSize)} on ${drives.length} drives · updated ${DATA.generated}`;

/* ---------- tabs */
let tab = "overview";
function show(t){ tab=t; for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.t===t);
  for (const s of ["overview","watch","files","folders"]) $("#"+s).classList.toggle("hide", s!==t);
  if (t==="watch") renderWatch(); if (t==="files") renderFiles(); if (t==="folders") renderTree(); }
$("#tabs").onclick = e => { const b=e.target.closest("button"); if (b) show(b.dataset.t); };

/* ---------- overview */
function countBy(arr, key){ const m=new Map(); for (const t of arr) for (const v of (Array.isArray(t[key])?t[key]:[t[key]])) if (v) m.set(v,(m.get(v)||0)+1); return [...m.entries()].sort((a,b)=>b[1]-a[1]); }
function rows(el, entries, onClick, fmt){ const max = entries.length? entries[0][1] : 1;
  el.innerHTML = entries.length ? entries.map(([k,v]) => `<div class="row" data-v="${esc(k)}"><div class="t" title="${esc(k)}">${esc(fmt?fmt(k):k)}</div><div class="b" style="width:${Math.max(3,v/max*100)}%"></div><div class="v">${num(v)}</div></div>`).join("") : '<div class="empty" style="padding:18px">Filled in as titles are looked up</div>';
  el.onclick = e => { const r=e.target.closest(".row"); if (r) onClick(r.dataset.v); }; }
function overview(){
  const n = k => titles.filter(t=>t.k===k && !t.a).length;
  const typeCount = t => files.filter(f=>f.type===t).length;
  const photoAlbums = new Set(files.filter(f=>f.type==="Image").map(f=>f.d+"|"+f.rel.slice(0,f.rel.lastIndexOf("\\")))).size;
  const k = [["Movies",n("Movie"),"var(--movies)",()=>goWatch({kind:"Movie"})],["TV shows",n("TV"),"var(--tv)",()=>goWatch({kind:"TV"})],["Anime",n("Anime"),"var(--anime)",()=>goWatch({kind:"Anime"})],["Animation",n("Animation"),"#81c784",()=>goWatch({kind:"Animation"})],
    ["Books & comics",typeCount("eBook")+typeCount("Comic"),"var(--books)",()=>goFiles("eBook")],["Photos",typeCount("Image"),"var(--photos)",()=>goFiles("Image")],["Home videos",(DATA.home||[]).reduce((a,g)=>a+g.n,0),"#5ed3a7",()=>goWatch({kind:"Home"})],["Music & audio",typeCount("Audio"),"#4fc3f7",()=>goFiles("Audio")]];
  $("#kpis").innerHTML = k.map((x,i)=>`<div class="card kpi" data-i="${i}"><div class="n">${num(x[1])}</div><div class="l"><span class="dot" style="background:${x[2]}"></span>${x[0]}${x[0]==="Photos"?` · ${num(photoAlbums)} folders`:""}</div></div>`).join("");
  $("#kpis").onclick = e => { const c=e.target.closest(".kpi"); if (c) k[c.dataset.i][3](); };
  $("#drives").innerHTML = drives.map((d,i) => { const used = d.total - d.free, top = Object.entries(d.byType).sort((a,b)=>b[1][1]-a[1][1]);
    const segs = top.map(([t,v])=>`<span title="${esc(t)} · ${fmtSize(v[1])}" style="width:${d.total? v[1]/d.total*100:0}%;background:${TYPE_COL[t]||"#607d8b"}"></span>`).join("");
    const other = Math.max(0, used - d.size);
    return `<div class="card drive"><div class="top"><div><div class="name">${esc(d.label||"Drive")} <span style="color:var(--faint);font-weight:400">${d.letter}:</span></div>
      <div class="meta">${esc(d.type)} · scanned ${esc(d.scanned)}</div></div><span class="pill ${d.online?"on":"off"}">${d.online?"Connected":"Not connected"}</span></div>
      <div class="bar">${segs}${other>0?`<span title="Other / system · ${fmtSize(other)}" style="width:${other/d.total*100}%;background:#3a4558"></span>`:""}</div>
      <div class="meta">${fmtSize(used)} used of ${fmtSize(d.total)} · <b style="color:var(--text);font-weight:500">${fmtSize(d.free)} free</b> · ${num(d.files)} files catalogued</div>
      <div class="legend">${top.slice(0,6).map(([t,v])=>`<span><span class="dot" style="background:${TYPE_COL[t]||"#607d8b"}"></span> ${esc(t)} <b>${fmtSize(v[1])}</b></span>`).join("")}</div>
      <div class="btns" style="margin-bottom:0"><button class="btn" data-drive="${i}">Browse folders</button><button class="btn" data-dfiles="${i}">Search files</button></div></div>`; }).join("");
  $("#drives").onclick = e => { const b=e.target.closest("button"); if (!b) return; if (b.dataset.drive) { treePath=[+b.dataset.drive]; show("folders"); } else { $("#fFDrive").value=b.dataset.dfiles; show("files"); } };
  const rec = titles.filter(t=>!t.a).sort((a,b)=>b.add.localeCompare(a.add)).slice(0,16);
  $("#recent").innerHTML = rec.map(t => `<div style="width:150px;flex:none">${tileHtml(t)}</div>`).join("");
  $("#recent").onclick = e => { const c=e.target.closest(".tile"); if (c) openTitle(+c.dataset.i); };
  const base = titles.filter(t=>!t.a);
  rows($("#langs"), countBy(base,"lang").slice(0,10), v=>goWatch({lang:v}));
  rows($("#genres"), countBy(base,"gen").slice(0,10), v=>goWatch({gen:v}));
  rows($("#dirs"), countBy(base,"dir").filter(x=>x[1]>1).slice(0,10), v=>goWatch({dir:v}));
  rows($("#decades"), countBy(base.filter(t=>t.dec),"dec").sort((a,b)=>b[0]-a[0]), v=>goWatch({dec:+v}), v=>v+"s");
}

/* ---------- watch */
const F = {kind:"", lang:"", dir:"", gen:new Set(), dec:new Set(), q:new Set(), drive:"", on:false, adult:false, sort:"az", text:"", person:""};
let shown = 60;
function opts(sel, entries, label){ sel.innerHTML = `<option value="">${label}</option>` + entries.map(([k,v])=>`<option value="${esc(k)}">${esc(k)} (${v})</option>`).join(""); }
function initWatch(){
  const base = titles.filter(t=>!t.a);
  opts($("#fLang"), countBy(base,"lang"), "Any language");
  opts($("#fDir"), countBy(base,"dir").sort((a,b)=>a[0].localeCompare(b[0])), "Any director");
  opts($("#fDrive"), countBy([...titles, ...(DATA.home||[])],"dr"), "Any drive");
  const chipset = (el, entries, set, fmt) => { el.innerHTML = entries.map(([k,v])=>`<span class="chip" data-v="${esc(k)}">${esc(fmt?fmt(k):k)}<span class="c">${v}</span></span>`).join("");
    el.onclick = e => { const c=e.target.closest(".chip"); if (!c) return; let v=c.dataset.v; if (set===F.dec) v=+v; set.has(v)?set.delete(v):set.add(v); shown=60; renderWatch(); }; };
  chipset($("#fGen"), countBy(base,"gen").slice(0,18), F.gen);
  chipset($("#fDec"), countBy(base.filter(t=>t.dec),"dec").sort((a,b)=>b[0]-a[0]), F.dec, v=>v+"s");
  chipset($("#fQ"), ["4K","1080p","720p","SD","Unknown"].map(q=>[q,base.filter(t=>t.qk===q).length]).filter(x=>x[1]), F.q);
  $("#kindSeg").onclick = e => { const b=e.target.closest("button"); if (b) { F.kind=b.dataset.k; shown=60; renderWatch(); } };
  for (const [id,key] of [["#fLang","lang"],["#fDir","dir"],["#fDrive","drive"],["#fSort","sort"]]) $(id).onchange = e => { F[key]=e.target.value; shown=60; renderWatch(); };
  $("#fOn").onchange = e => { F.on=e.target.checked; renderWatch(); };
  $("#fAdult").onchange = e => { F.adult=e.target.checked; shown=60; renderWatch(); };
  $("#reset").onclick = () => { Object.assign(F,{kind:"",lang:"",dir:"",drive:"",on:false,adult:false,person:""}); F.gen.clear(); F.dec.clear(); F.q.clear(); $("#q").value=""; F.text=""; shown=60; renderWatch(); };
  $("#more").onclick = () => { shown += 120; renderWatch(); };
  $("#grid").onclick = e => { const c=e.target.closest(".tile"); if (!c) return; if (c.dataset.h!==undefined) openHome(+c.dataset.h); else openTitle(+c.dataset.i); };
  $("#active").onclick = e => { const c=e.target.closest(".chip"); if (!c) return; const [k,v]=c.dataset.f.split("|");
    if (F[k] instanceof Set) F[k].delete(k==="dec"?+v:v); else F[k] = k==="on"?false:""; if (k==="text") $("#q").value=""; renderWatch(); };
}
function filtered(){
  const words = F.text.toLowerCase().split(/\s+/).filter(Boolean);
  let r = titles.filter(t => (F.adult||!t.a) && (!F.kind||t.k===F.kind) && (!F.lang||t.lang.includes(F.lang)) && (!F.dir||t.dir.includes(F.dir)) && (!F.person||t.cast.includes(F.person)||t.dir.includes(F.person))
    && (!F.drive||t.dr.includes(F.drive)) && (!F.on||t.on) && (!F.gen.size||t.gen.some(g=>F.gen.has(g))) && (!F.dec.size||F.dec.has(t.dec)) && (!F.q.size||F.q.has(t.qk))
    && words.every(w => t.hay.includes(w)));
  const s = F.sort;
  r.sort((a,b)=> s==="new"? b.add.localeCompare(a.add) : s==="year"? (b.y||0)-(a.y||0) : s==="old"? (a.y||9999)-(b.y||9999) : s==="size"? b.sz-a.sz : a.t.localeCompare(b.t));
  return r;
}
function initials(s){ return s.split(/\s+/).filter(w=>/[A-Za-z0-9]/.test(w[0]||"")).slice(0,2).map(w=>w[0].toUpperCase()).join(""); }
function hue(s){ let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))%360; return h; }
function posterHtml(t){
  const h = hue(t.t), bg = `linear-gradient(160deg,hsl(${h} 45% 32%),hsl(${(h+40)%360} 50% 14%))`;
  const img = t.img && t.on ? `<img loading="lazy" src="${fileUrl(t.img)}" onerror="this.remove()">` : "";
  const q = t.qk==="4K"?'<span class="bdg k4">4K</span>':t.qk&&t.qk!=="Unknown"?`<span class="bdg">${t.qk}</span>`:"<span></span>";
  return `<div class="poster" style="background:${bg}"><div class="ph">${esc(t.t)}<small>${t.y||""} ${t.k!=="Movie"?"· "+(t.k==="TV"?"TV":t.k):""}</small></div>${img}
    <div class="badges">${q}${t.on?"":'<span class="bdg off">offline</span>'}</div></div>`;
}
function tileHtml(t){ return `<div class="tile" data-i="${t.i}">${posterHtml(t)}<div class="tt" title="${esc(t.t)}">${esc(t.t)}</div><div class="ts">${[t.y, t.dir[0]||(t.ep?t.ep+" episodes":""), t.lang[0]].filter(Boolean).map(esc).join(" · ")}</div></div>`; }
function renderWatch(){
  for (const b of $("#kindSeg").children) b.classList.toggle("on", b.dataset.k===F.kind);
  const isHome = F.kind==="Home";
  $("#titleFilters").classList.toggle("hide", isHome); $("#homeFilters").classList.toggle("hide", !isHome); $("#fAdult").parentElement.classList.toggle("hide", isHome);
  if (isHome) { $("#fDrive").value=F.drive; $("#fOn").checked=F.on; return renderHome(); }
  $("#fLang").value=F.lang; $("#fDir").value=F.dir; $("#fDrive").value=F.drive; $("#fSort").value=F.sort; $("#fOn").checked=F.on; $("#fAdult").checked=F.adult;
  for (const [el,set] of [["#fGen",F.gen],["#fDec",F.dec],["#fQ",F.q]]) for (const c of $(el).children) c.classList.toggle("on", set.has(el==="#fDec"?+c.dataset.v:c.dataset.v));
  const r = filtered();
  $("#count").textContent = `${num(r.length)} of ${num(titles.filter(t=>F.adult||!t.a).length)} titles`;
  const act = [];
  if (F.text) act.push(["text",F.text,`“${F.text}”`]); if (F.person) act.push(["person",F.person,F.person]);
  if (F.lang) act.push(["lang",F.lang,F.lang]); if (F.dir) act.push(["dir",F.dir,"Dir. "+F.dir]); if (F.drive) act.push(["drive",F.drive,F.drive]); if (F.on) act.push(["on","1","Connected only"]);
  for (const g of F.gen) act.push(["gen",g,g]); for (const d of F.dec) act.push(["dec",d,d+"s"]); for (const q of F.q) act.push(["q",q,q]);
  $("#active").innerHTML = act.map(a=>`<span class="chip on" data-f="${a[0]}|${esc(a[1])}">${esc(a[2])} ✕</span>`).join("");
  $("#grid").innerHTML = r.length ? r.slice(0,shown).map(tileHtml).join("") : '<div class="empty" style="grid-column:1/-1">Nothing matches these filters.</div>';
  $("#more").classList.toggle("hide", r.length <= shown);
}
function goWatch(f){ Object.assign(F,{kind:"",lang:"",dir:"",drive:"",person:""}); F.gen.clear(); F.dec.clear(); F.q.clear();
  if (f.kind) F.kind=f.kind; if (f.lang) F.lang=f.lang; if (f.dir) F.dir=f.dir; if (f.gen) F.gen.add(f.gen); if (f.dec) F.dec.add(f.dec); if (f.person) F.person=f.person;
  F.text=""; $("#q").value=""; shown=60; show("watch"); window.scrollTo(0,0); closeDrawer(); }


/* ---------- home videos */
const home = DATA.home || [];
home.forEach((g,i)=>{ g.i=i; g.hay=[g.g,g.kind,...g.people,...g.events,g.start.slice(0,4)].join(" ").toLowerCase(); });
const HF = {people:"", hk:new Set()};
function fmtDur(s){ s=+s||0; const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=Math.floor(s%60); return h? `${h}h ${m}m` : m? `${m}m ${String(x).padStart(2,"0")}s` : s? `${x}s` : ""; }
function fmtRange(a,b){ const da=new Date(a), db=new Date(b), o={day:"numeric",month:"short",year:"numeric"}; return a===b? da.toLocaleDateString("en-IN",o) : `${da.toLocaleDateString("en-IN",{day:"numeric",month:"short"})} – ${db.toLocaleDateString("en-IN",o)}`; }
function initHome(){
  $("#fPeople").innerHTML = `<option value="">Anyone</option>` + countBy(home,"people").map(([k,v])=>`<option value="${esc(k)}">${esc(k)} (${v})</option>`).join("");
  $("#fPeople").onchange = e => { HF.people=e.target.value; renderWatch(); };
  $("#fHK").innerHTML = ["Trip","Activity","Event","Month"].map(k=>[k,home.filter(g=>g.kind===k).length]).filter(x=>x[1]).map(([k,v])=>`<span class="chip" data-v="${k}">${k==="Month"?"Undated / by month":k+"s"}<span class="c">${v}</span></span>`).join("");
  $("#fHK").onclick = e => { const c=e.target.closest(".chip"); if (!c) return; const v=c.dataset.v; HF.hk.has(v)?HF.hk.delete(v):HF.hk.add(v); renderWatch(); };
}
function homeTile(g){
  const h=hue(g.g), bg=`linear-gradient(160deg,hsl(${h} 40% 30%),hsl(${(h+60)%360} 45% 12%))`;
  return `<div class="tile" data-h="${g.i}"><div class="poster" style="background:${bg};aspect-ratio:4/3"><div class="ph">${esc(g.g)}<small>${esc(g.kind)} · ${num(g.n)} clip${g.n>1?"s":""}</small></div>
    <div class="badges"><span class="bdg">${esc(fmtRange(g.start,g.end))}</span>${g.on?"":'<span class="bdg off">offline</span>'}</div></div>
    <div class="tt">${esc(g.g)}</div><div class="ts">${esc([fmtDur(g.dur), g.people.slice(0,3).join(", ")].filter(Boolean).join(" · ")||fmtSize(g.sz))}</div></div>`;
}
function renderHome(){
  const words = F.text.toLowerCase().split(/\s+/).filter(Boolean);
  let r = home.filter(g => (!HF.people||g.people.includes(HF.people)) && (!HF.hk.size||HF.hk.has(g.kind)) && (!F.drive||g.dr.includes(F.drive)) && (!F.on||g.on) && words.every(w=>g.hay.includes(w)));
  r.sort((a,b)=> F.sort==="az"? a.g.localeCompare(b.g) : F.sort==="size"? b.sz-a.sz : F.sort==="old"? a.start.localeCompare(b.start) : b.start.localeCompare(a.start));
  for (const c of $("#fHK").children) c.classList.toggle("on", HF.hk.has(c.dataset.v));
  $("#count").textContent = `${num(r.length)} groups · ${num(r.reduce((a,g)=>a+g.n,0))} home videos`;
  $("#active").innerHTML = "";
  $("#grid").innerHTML = r.length ? r.slice(0,shown).map(homeTile).join("") : '<div class="empty" style="grid-column:1/-1">No home videos match.</div>';
  $("#more").classList.toggle("hide", r.length <= shown);
}
function openHome(i){
  const g = home[i], d = $("#drawer");
  d.innerHTML = `<button class="close" id="dclose">×</button><div class="dbody" style="padding-top:26px">
    <h3 style="margin:0 0 4px;font-size:22px">${esc(g.g)}</h3>
    <div style="color:var(--muted)">${esc(g.kind)} · ${esc(fmtRange(g.start,g.end))} · ${num(g.n)} clips · ${fmtDur(g.dur)||fmtSize(g.sz)}</div>
    ${g.people.length?`<div style="margin-top:8px">People: ${g.people.map(p=>`<span class="lnk" data-hp="${esc(p)}">${esc(p)}</span>`).join(", ")}</div>`:""}
    ${g.events.length?`<div style="margin-top:4px;color:var(--faint);font-size:13px">Folders: ${esc(g.events.join(", "))}</div>`:""}
    <div class="card flist" style="margin-top:16px">${g.items.map(x=>`<div class="fr" style="grid-template-columns:90px minmax(0,1fr) 70px 70px 26px">
      <div style="color:var(--faint);font-size:12px">${esc(x.d)}</div>
      <div class="nm">${x.on?`<a href="${fileUrl(x.p)}" style="color:var(--text)">${esc(x.n)}</a>`:esc(x.n)}${x.pe.length?` <span style="color:var(--faint);font-size:12px">· ${esc(x.pe.join(", "))}</span>`:""}</div>
      <div class="sz">${fmtDur(x.dur)}</div><div class="sz" style="font-size:11.5px">${esc((x.q||"").split(" · ")[0])}</div><span class="lnk" data-copy="${esc(x.p)}" title="Copy path">⧉</span></div>`).join("")}</div>
    <div style="color:var(--faint);font-size:12.5px;margin-top:12px">Tags come from folder names, dates and the people list in Documents\\Drive Catalog\\people-and-places.json.</div></div>`;
  d.classList.add("on"); $("#scrim").classList.add("on"); d.scrollTop=0;
  $("#dclose").onclick = closeDrawer;
  d.onclick = e => { const c=e.target.closest("[data-copy]"); if (c) return copy(c.dataset.copy); const p=e.target.closest("[data-hp]"); if (p) { HF.people=p.dataset.hp; $("#fPeople").value=HF.people; closeDrawer(); renderWatch(); } };
}

/* ---------- drawer */
function closeDrawer(){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#scrim").onclick = closeDrawer; document.addEventListener("keydown", e => { if (e.key==="Escape") closeDrawer(); });
function linkList(arr, kind){ return arr.length ? arr.map(v=>`<span class="lnk" data-${kind}="${esc(v)}">${esc(v)}</span>`).join(", ") : '<span style="color:var(--faint)">—</span>'; }
function openTitle(i){
  const t = titles[i], d = $("#drawer");
  const runtime = t.min ? `${Math.floor(t.min/60)}h ${t.min%60}m` : t.dur ? `${Math.floor(t.dur/3600)}h ${Math.floor(t.dur%3600/60)}m` : "";
  d.innerHTML = `<button class="close" id="dclose">×</button>
    <div class="dhead"><div class="poster">${posterHtml(t).replace(/^<div class="poster"[^>]*>/,"").replace(/<\/div>$/,"")}</div>
    <div><h3>${esc(t.t)}</h3><div style="color:var(--muted)">${[t.y, t.k==="Movie"?"Movie":t.k==="TV"?"TV show":t.k==="Animation"?"Animation":"Anime", runtime].filter(Boolean).join(" · ")}</div>
    ${t.ot?`<div style="color:var(--faint);font-size:13px;margin-top:4px">${esc(t.ot)}</div>`:""}
    <div style="margin-top:10px"><span class="pill ${t.on?"on":"off"}">${t.on?"On a connected drive":"Drive not connected"}</span></div></div></div>
    <div class="dbody">${t.desc?`<div style="color:var(--muted)">${esc(t.desc)}</div>`:""}
    <dl class="kv">
      <dt>Director</dt><dd>${linkList(t.dir,"person")}</dd>
      <dt>Cast</dt><dd>${linkList(t.cast,"person")}</dd>
      <dt>Language</dt><dd>${linkList(t.lang,"lang")}</dd>
      <dt>Country</dt><dd>${esc(t.ctry.join(", ")||"—")}</dd>
      <dt>Genre</dt><dd>${linkList(t.gen,"gen")}</dd>
      <dt>Quality</dt><dd>${esc(t.q||"—")}${t.res?` · ${esc(t.res)}`:""}</dd>
      ${t.ep?`<dt>Episodes</dt><dd>${t.ep}${t.se>1?` across ${t.se} seasons`:""}</dd>`:""}
      <dt>Size</dt><dd>${fmtSize(t.sz)}</dd>
      <dt>Drive</dt><dd>${esc(t.dr.join(", "))}</dd>
      <dt>Added</dt><dd>${esc(t.add)}</dd>
    </dl>
    <div class="path">${esc(t.p)}</div>
    <div class="btns">${t.on?`<a class="btn pri" href="${fileUrl(t.ep? t.f : t.f)}">Open folder</a>`:""}<button class="btn" id="dcopy">Copy path</button>
      ${t.imdb?`<a class="btn" target="_blank" href="https://www.imdb.com/title/${esc(t.imdb)}/">IMDb ↗</a>`:""}
      ${t.wd?`<a class="btn" target="_blank" href="https://www.wikidata.org/wiki/${esc(t.wd)}">Wikidata ↗</a>`:""}
      <a class="btn" target="_blank" href="https://www.google.com/search?q=${encodeURIComponent(t.t+" "+(t.y||"")+(t.k==="Movie"?" film":""))}">Google ↗</a></div>
    ${!t.dir.length&&!t.cast.length?'<div style="color:var(--faint);font-size:12.5px">Details (director, cast, language) appear once Desktop Organizer has looked this title up online.</div>':""}
    </div>`;
  d.classList.add("on"); $("#scrim").classList.add("on"); d.scrollTop=0;
  $("#dclose").onclick = closeDrawer; $("#dcopy").onclick = () => copy(t.p);
  d.onclick = e => { const l=e.target.closest(".lnk"); if (!l) return; if (l.dataset.person) goWatch({person:l.dataset.person}); else if (l.dataset.lang) goWatch({lang:l.dataset.lang}); else if (l.dataset.gen) goWatch({gen:l.dataset.gen}); };
}

/* ---------- files */
function initFiles(){
  const tc = countBy(files,"type");
  $("#fType").innerHTML = `<option value="">All types</option>` + tc.map(([k,v])=>`<option value="${esc(k)}">${esc(k)} (${num(v)})</option>`).join("");
  $("#fFDrive").innerHTML = `<option value="">All drives</option>` + drives.map((d,i)=>`<option value="${i}">${esc(d.label)} (${d.letter}:)${d.online?"":" — offline"}</option>`).join("");
  for (const id of ["#fType","#fFDrive","#fFSort"]) $(id).onchange = renderFiles;
  $("#flist").onclick = e => { const f=e.target.closest(".fd"); if (f) { treePath=[+f.dataset.d, ...f.dataset.p.split("\\").filter(Boolean)]; show("folders"); } const c=e.target.closest("[data-copy]"); if (c) copy(c.dataset.copy); };
}
function goFiles(type){ $("#fType").value=type; $("#q").value=""; show("files"); }
function fileRow(f){ const d=drives[f.d], folder=f.rel.slice(0,f.rel.lastIndexOf("\\")), full=d.letter+":\\"+f.rel;
  return `<div class="fr"><div class="ico" style="background:${TYPE_COL[f.type]||"#607d8b"}">${esc((f.type||"?").slice(0,3).toUpperCase())}</div>
  <div class="nm" title="${esc(full)}">${d.online?`<a href="${fileUrl(full)}" style="color:var(--text)">${esc(f.name)}</a>`:esc(f.name)}${f.q?` <span style="color:var(--faint);font-size:12px">· ${esc(f.q)}</span>`:""}</div>
  <div class="fd" data-d="${f.d}" data-p="${esc(folder)}" title="Browse this folder">${esc(d.letter+":\\"+folder)}</div>
  <div class="sz">${fmtSize(f.size)}</div><div style="display:flex;gap:6px;align-items:center;justify-content:flex-end"><span class="pill ${d.online?"on":"off"}">${esc(d.label)}</span><span class="lnk" data-copy="${esc(full)}" title="Copy path">⧉</span></div></div>`; }
function renderFiles(){
  const q = $("#q").value.trim().toLowerCase(), words=q.split(/\s+/).filter(Boolean), type=$("#fType").value, dv=$("#fFDrive").value, sort=$("#fFSort").value;
  let r = files.filter(f => (!type||f.type===type) && (dv===""||f.d===+dv) && words.every(w => f.rel.toLowerCase().includes(w)));
  if (sort==="size") r.sort((a,b)=>b.size-a.size); else if (sort==="new") r.sort((a,b)=>a.age-b.age); else if (sort==="name") r.sort((a,b)=>a.name.localeCompare(b.name));
  else if (words.length) r.sort((a,b)=> (words.every(w=>b.lname.includes(w))-words.every(w=>a.lname.includes(w))) || b.size-a.size);
  $("#fcount").textContent = `${num(r.length)} files · ${fmtSize(r.reduce((s,f)=>s+f.size,0))}${r.length>400?" · showing first 400":""}`;
  $("#flist").innerHTML = `<div class="fr head"><div></div><div>Name</div><div>Folder</div><div style="text-align:right">Size</div><div style="text-align:right">Drive</div></div>` +
    (r.length ? r.slice(0,400).map(fileRow).join("") : '<div class="empty">No files match.</div>');
}

/* ---------- folders */
let treePath = [];
function renderTree(){
  if (!treePath.length) {
    $("#crumbs").innerHTML = `<b>All drives</b>`;
    $("#ftree").innerHTML = `<div class="fr head"><div></div><div>Drive</div><div>Status</div><div style="text-align:right">Catalogued</div><div style="text-align:right">Files</div></div>` +
      drives.map((d,i)=>`<div class="fr" style="cursor:pointer" data-go="${i}"><div class="ico" style="background:var(--accent)">${d.letter}</div><div class="nm"><b>${esc(d.label)}</b></div><div><span class="pill ${d.online?"on":"off"}">${d.online?"Connected":"Not connected"}</span></div><div class="sz">${fmtSize(d.size)}</div><div class="sz">${num(d.files)}</div></div>`).join("");
  } else {
    const di = treePath[0], d = drives[di], pre = treePath.slice(1).join("\\"), preL = pre ? pre + "\\" : "";
    const sub = new Map(), here = [];
    for (const f of files) { if (f.d!==di || !f.rel.startsWith(preL)) continue; const rest=f.rel.slice(preL.length), k=rest.indexOf("\\");
      if (k<0) here.push(f); else { const n=rest.slice(0,k); const e=sub.get(n)||{n, size:0, count:0}; e.size+=f.size; e.count++; sub.set(n,e); } }
    const crumbs = [`<span data-c="0">All drives</span>`, `<span data-c="1">${esc(d.label)} (${d.letter}:)</span>`, ...treePath.slice(1).map((p,i)=>`<span data-c="${i+2}">${esc(p)}</span>`)];
    $("#crumbs").innerHTML = crumbs.join("<i>›</i>") + (d.online?` <a class="btn" style="margin-left:10px" href="${fileUrl(d.letter+":\\"+pre)}">Open in browser</a>`:` <span class="pill off" style="margin-left:10px">Not connected — browsing the catalogue</span>`);
    const dirs = [...sub.values()].sort((a,b)=>b.size-a.size);
    $("#ftree").innerHTML = `<div class="fr head"><div></div><div>Name</div><div>Type</div><div style="text-align:right">Size</div><div style="text-align:right">Items</div></div>` +
      dirs.map(x=>`<div class="fr" style="cursor:pointer" data-sub="${esc(x.n)}"><div class="ico" style="background:#ffd54f">DIR</div><div class="nm"><b>${esc(x.n)}</b></div><div style="color:var(--faint)">Folder</div><div class="sz">${fmtSize(x.size)}</div><div class="sz">${num(x.count)}</div></div>`).join("") +
      here.sort((a,b)=>a.name.localeCompare(b.name)).slice(0,500).map(f=>`<div class="fr"><div class="ico" style="background:${TYPE_COL[f.type]||"#607d8b"}">${esc(f.type.slice(0,3).toUpperCase())}</div><div class="nm">${d.online?`<a href="${fileUrl(d.letter+":\\"+f.rel)}" style="color:var(--text)">${esc(f.name)}</a>`:esc(f.name)}</div><div style="color:var(--faint)">${esc(f.type)}${f.q?" · "+esc(f.q):""}</div><div class="sz">${fmtSize(f.size)}</div><div class="sz"><span class="lnk" data-copy="${esc(d.letter+":\\"+f.rel)}">⧉</span></div></div>`).join("") +
      (!dirs.length && !here.length ? '<div class="empty">Empty folder</div>' : "");
  }
}
$("#ftree").onclick = e => { const g=e.target.closest("[data-go]"); if (g) { treePath=[+g.dataset.go]; return renderTree(); }
  const s=e.target.closest("[data-sub]"); if (s) { treePath.push(s.dataset.sub); window.scrollTo(0,0); return renderTree(); }
  const c=e.target.closest("[data-copy]"); if (c) copy(c.dataset.copy); };
$("#crumbs").onclick = e => { const c=e.target.closest("[data-c]"); if (!c) return; const n=+c.dataset.c; treePath = n===0?[]:treePath.slice(0,n); renderTree(); };

/* ---------- global search */
let st;
$("#q").addEventListener("input", () => { clearTimeout(st); st = setTimeout(() => {
  const v = $("#q").value.trim();
  if (tab==="files") return renderFiles();
  if (tab!=="watch" && v) { const hits = titles.filter(t => v.toLowerCase().split(/\s+/).every(w=>t.hay.includes(w))).length; if (!hits) { show("files"); return; } show("watch"); }
  F.text = v; shown=60; renderWatch(); }, 160); });

overview(); initWatch(); initHome(); initFiles();
document.addEventListener("keydown", e => { if (e.key==="/" && document.activeElement!==$("#q")) { e.preventDefault(); $("#q").focus(); } });
</script>
</body>
